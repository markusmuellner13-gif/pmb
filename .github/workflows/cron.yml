name: Run trading cycle

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by a few minutes under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs: {}

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/cycle
        run: |
          set -e
          if [ -z "${{ secrets.BOT_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "BOT_URL and/or CRON_SECRET repository secrets are not set. See README.md."
            exit 1
          fi
          http_code=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ secrets.BOT_URL }}/api/cron/cycle" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_code"
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            exit 1
          fi
