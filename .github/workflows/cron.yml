name: Run trading cycle

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by a few minutes under load.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs: {}

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/cycle
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$BOT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BOT_URL and/or CRON_SECRET repository secrets are not set. See README.md."
            exit 1
          fi
          # Strip any trailing slash so we never build a double-slash path
          # (Vercel 308-redirects those, which curl won't follow by default).
          clean_url="${BOT_URL%/}"
          http_code=$(curl -sL -o response.json -w "%{http_code}" -X POST \
            "$clean_url/api/cron/cycle" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP status: $http_code"
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            exit 1
          fi
