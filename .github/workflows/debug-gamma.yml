name: Debug - inspect Gamma API market shape

# Temporary diagnostic, manual only. Dumps one real market's raw JSON so we
# can confirm real field names (category/tags/etc) instead of guessing.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch events endpoint shape
        run: |
          echo "--- top 8 events by volume: title + tags + market count ---"
          curl -s "https://gamma-api.polymarket.com/events?limit=8&active=true&closed=false&order=volume24hr&ascending=false" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const evs=JSON.parse(d);for(const e of evs){console.log(JSON.stringify({title:e.title,tags:(e.tags||[]).map(t=>t.label||t.slug||t),marketCount:(e.markets||[]).length}));}})"
          echo
          echo "--- one event, one nested market's real keys ---"
          curl -s "https://gamma-api.polymarket.com/events?limit=1&active=true&closed=false&order=volume24hr&ascending=false" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const e=JSON.parse(d)[0];const m=(e.markets||[])[0];console.log('event tags:', JSON.stringify(e.tags));console.log('nested market keys:', m?Object.keys(m).join(','):'NONE');})"
